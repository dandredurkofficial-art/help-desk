<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Audiory Buyer & Producer Access</title>
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/mobile-fix.css">
  <style>
    /* Premium Modern Dark Theme with Original Vibrant Blue Accents */
    body {
      background-color: #0b0c10;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }

    /* Minimalist Top Center Logo Placement */
    .brand-header {
      margin-bottom: 32px;
      text-align: center;
    }

    .brand-logo {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo svg {
      height: 52px;
      width: auto;
      display: block;
    }

    /* Ultra-Clean Content Container */
    .auth-box {
      background: #12141c;
      max-width: 440px;
      width: 90%;
      border-radius: 16px;
      padding: 40px;
      border: 1px solid #1f2330;
      box-sizing: border-box;
    }

    .auth-box h2 {
      color: #ffffff;
      font-size: 26px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 28px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    /* Form Fields styling */
    .field {
      margin-bottom: 22px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Dark Input Field Wrappers */
    .auth-input {
      width: 100%;
      height: 54px;
      border-radius: 10px;
      border: 1px solid #262b3d;
      background: #1a1d29;
      display: flex;
      align-items: center;
      box-sizing: border-box;
      overflow: hidden;
      padding-right: 6px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* Focus border colored with your original brand blue */
    .auth-input:focus-within {
      border-color: #5533ff;
      box-shadow: 0 0 0 3px rgba(85, 51, 255, 0.15);
    }

    .auth-input-main {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      min-width: 0;
      height: 100%;
      box-sizing: border-box;
    }

    .auth-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      flex: 0 0 auto;
    }

    .auth-icon svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .auth-divider {
      width: 1px;
      height: 20px;
      background: #262b3d;
      flex: 0 0 auto;
    }

    .auth-input input {
      flex: 1;
      min-width: 0;
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .auth-input input::placeholder {
      color: #4a5568;
      opacity: 1;
    }

    /* Password Eye Button styling */
    .auth-eye-btn {
      width: 40px;
      min-width: 40px;
      height: 40px;
      border: none;
      border-radius: 8px;
      background: #262b3d;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      margin: 0;
      flex: 0 0 40px;
      box-sizing: border-box;
      align-self: center;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .auth-eye-btn:hover {
      background: #2f354c;
      color: #ffffff;
    }

    .auth-eye-btn svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    /* Main Action Button with original vibrant brand color */
    .auth-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    .auth-actions button {
      flex: 1;
      min-width: 140px;
      height: 52px;
      background: #5533ff;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .auth-actions button:hover {
      background: #4422ee;
    }

    .auth-actions button:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    /* Links adjusted to use your signature brand color */
    .link-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 0;
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .link-btn:hover {
      color: #5533ff;
      text-decoration: underline;
    }

    .muted {
      color: #ef4444;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
    }

    p {
      color: #64748b;
      font-size: 14px;
    }

    p a {
      color: #5533ff;
      font-weight: 600;
      text-decoration: none;
    }

    p a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .auth-box {
        padding: 32px 24px;
        border: none;
        background: transparent;
      }
      .auth-input {
        height: 50px;
      }
    }
  </style>
</head>
<body>

  <header class="brand-header">
    <a href="/" class="brand-logo" aria-label="Audiory Home">
      <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="25" cy="25" r="23" stroke="#ffffff" stroke-width="3" />
        <circle cx="25" cy="25" r="16" stroke="#262b3d" stroke-width="1.5" />
        <path d="M25 10L35 37H30L25 23L20 37H15L25 10Z" fill="#ffffff"/>
        <path d="M19 28H31" stroke="#0b0c10" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="25" cy="18" r="1.5" fill="#5533ff" />
      </svg>
    </a>
  </header>

  <div class="auth-box">
    <h2>Sign In</h2>

    <div class="field">
      <label for="email">Email Address</label>
      <div class="auth-input">
        <div class="auth-input-main">
          <span class="auth-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </span>
          <span class="auth-divider"></span>
          <input id="email" type="email" placeholder="Type your email" autocomplete="email" />
        </div>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="auth-input">
        <div class="auth-input-main">
          <span class="auth-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <span class="auth-divider"></span>
          <input id="password" type="password" placeholder="Type your password" autocomplete="current-password" />
        </div>

        <button class="auth-eye-btn" id="pwToggle" type="button" aria-label="Show password">
          <svg id="pwEyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg id="pwEyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>
    </div>

    <div class="auth-actions">
      <button id="loginBtn" type="button">Continue</button>
      <button id="googleBtn" type="button" style="display:none;">Continue with Google</button>
    </div>

    <div style="text-align: center; margin-top: 8px;">
      <button class="link-btn" id="resetBtn" type="button">Forgot password?</button>
    </div>
    
    <div class="muted" id="status"></div>

    <p style="margin-top:28px; text-align: center;">
      Don’t have an account?
      <a href="/register/">Register</a>
    </p>
  </div>

  <script type="module" src="/auth-ui.js"></script>

  <script>
    document.getElementById("loginBtn")?.addEventListener("click", async () => {
      const btn = document.getElementById("loginBtn");
      const status = document.getElementById("status");

      try{
        if (status) status.textContent = "";
        if (btn){
          btn.disabled = true;
          btn.textContent = "Logging in...";
        }

        await window.loginUser?.();
      } catch (e){
        console.error(e);
      } finally {
        if (btn){
          btn.disabled = false;
          btn.textContent = "Continue";
        }
      }
    });
    document.getElementById("resetBtn")?.addEventListener("click", async () => {
      const btn = document.getElementById("resetBtn");

      try{
        if (btn){
          btn.disabled = true;
          btn.textContent = "Sending reset link...";
        }

        await window.resetPassword?.();
      } catch (e){
        console.error(e);
      } finally {
        if (btn){
          btn.disabled = false;
          btn.textContent = "Forgot password?";
        }
      }
    });

    (function(){
      const pw = document.getElementById("password");
      const btn = document.getElementById("pwToggle");
      const eyeOpen = document.getElementById("pwEyeOpen");
      const eyeOff = document.getElementById("pwEyeOff");
      if(!pw || !btn) return;

      btn.addEventListener("click", ()=>{
        const showing = pw.type === "text";
        pw.type = showing ? "password" : "text";
        if (eyeOpen) eyeOpen.style.display = showing ? "" : "none";
        if (eyeOff) eyeOff.style.display = showing ? "none" : "";
      });
    })();
  </script>
</body>
</html>
